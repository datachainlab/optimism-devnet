optimism_package:
  faucet:
    enabled: true
    image: {{ localDockerImage "op-faucet" }}
  chains:
    op-kurtosis:
      participants:
        node0:
          el:
            type: op-reth
            image: {{ localDockerImage "op-reth" }}
            log_level: ""
            extra_env_vars: {}
            extra_labels: {}
            extra_params: []
            tolerations: []
            volume_size: 0
            min_cpu: 0
            max_cpu: 0
            min_mem: 0
            max_mem: 0
          cl:
            type: op-node
            image: {{ localDockerImage "op-node" }}
            log_level: ""
            extra_env_vars: {}
            extra_labels: {}
            extra_params: []
            tolerations: []
            volume_size: 0
            min_cpu: 0
            max_cpu: 0
            min_mem: 0
            max_mem: 0
          mev_params:
            image: ""
            builder_host: ""
            builder_port: ""
      network_params:
        network: "kurtosis"
        network_id: "2151908"
        seconds_per_slot: 2
        fjord_time_offset: 0
        granite_time_offset: 0
        holocene_time_offset: 0
        isthmus_time_offset: 0
        jovian_time_offset: 0
        karst_time_offset: 0
        fund_dev_accounts: true
      batcher_params:
        image: {{ localDockerImage "op-batcher" }}
        extra_params: [
          "--txmgr.cell-proof-time=0"
        ]
      proposer_params:
        image: {{ localDockerImage "op-proposer" }}
        extra_params: []
        # Super Root proposals (game type 5 = SUPER_PERMISSIONED).
        # op-deployer >= v1.19.x defaults `standard.DisputeGameType` to 5 and
        # DevFeatures.SUPER_ROOT_GAMES_MIGRATION is enabled unconditionally, so the
        # OPCM only accepts SUPER_PERMISSIONED(5) / SUPER_CANNON_KONA(9) as the
        # initial game type — game type 1 is no longer deployable.
        #
        # For a super game type the optimism-package proposer launcher passes
        # --superroot-rpcs (instead of --rollup-rpc; op-proposer requires exactly one
        # of the two) pointing at op-node, which serves `superroot_atTimestamp`
        # itself. That makes the proposer submit rootClaim = SuperRoot and
        # extraData = SuperRootProof. op-supernode is only needed for a multi-chain
        # interop dependency set.
        game_type: 5
        proposal_interval: 10m
  challengers:
    challenger:
      enabled: true
      image: {{ localDockerImage "op-challenger" }}
      participants: "*"
      cannon_prestates_url: {{ localPrestate.URL }}
      # op v1.19.1 removed op-program, so the legacy `cannon` (game type 0) trace
      # type can no longer run (its --cannon-server binary is gone). The
      # `permissioned` (game type 1) trace type does NOT need op-program and
      # shares the cannon-scoped flags the launcher already passes (rollup
      # config, l2 genesis, prestates URL, cannon bin from the image env).
      #
      # With game type 5 proposals, op-challenger CANNOT play the games:
      # `super-permissioned` is not in `PlayableGameTypes`, so --trace-type
      # rejects it. It IS in `SupportedLifecycleGameTypes`, so the monitor keeps
      # type 5 games for bond claim / close and logs
      # "Game type not configured for play; processing lifecycle only"
      # (op-challenger/game/monitor.go) instead of failing. That is fine here:
      # SUPER_PERMISSIONED games resolve to DEFENDER_WINS as soon as they are
      # created (observed resolvedAt == createdAt), so nothing has to play or
      # resolve them. Keeping `permissioned` here means the challenger boots with
      # the flags the launcher already supplies and stays harmless (it only warns
      # "No game implementation set for game type gameType=permissioned").
      # (`super-cannon-kona` — game type 9 — would let the challenger resolve on
      # its own, but needs --superroot-rpc plus the --cannon-kona-* flags and a
      # kona-client-int prestate, none of which the launcher passes today.)
      cannon_trace_types: ["permissioned"]
  op_contract_deployer_params:
    image: {{ localDockerImage "op-deployer" }}
    l1_artifacts_locator: {{ localContractArtifacts "l1" }}
    l2_artifacts_locator: {{ localContractArtifacts "l2" }}
    overrides:
      faultGameAbsolutePrestate: "0x{{ localPrestate.Hashes.prestate_mt64 | trimPrefix "0x" }}"
  global_log_level: "info"
  global_node_selectors: {}
  global_tolerations: []
  persistent: false
ethereum_package:
  # The package defaults to ethereum-genesis-generator:5.0.6, which sets
  # amsterdamTime in the genesis but does NOT emit an `amsterdam` entry in
  # `blobSchedule`. geth rejects that ("missing entry for fork amsterdam in
  # blobSchedule"). 6.x emits the amsterdam blob schedule for gloas/Amsterdam.
  ethereum_genesis_generator_params:
    image: ethpandaops/ethereum-genesis-generator:6.0.8
  participants:
    # L1 clients are kept identical to the cosmos-ethereum-ibc-lcp e2e devnet, so the
    # ethereum light client is exercised against the same pair on both sides.
    #   geth: the official release. v1.17.6 ships Amsterdam/BAL and schedules the fork
    #     on Sepolia, so the ethpandaops glamsterdam-devnet build is no longer needed.
    #     (ethrex:glamsterdam-devnet-5 was unusable: its eth_call enforces nonce
    #     equality, which breaks op-deployer's `apply` step.)
    #   lodestar: v1.49.0 with ChainSafe/lodestar PR #10022 cherry-picked, which fixes
    #     the archiver deleting the light client data of canonical Gloas blocks.
    #     Switch to a stock release once the PR lands.
    - el_type: geth
      el_image: {{ env "GETH_IMAGE" | default "ethereum/client-go:v1.17.6" }}
      cl_type: lodestar
      cl_image: {{ env "LODESTAR_IMAGE" | default "ghcr.io/yoshidan/lodestar:v1.49.0-pr10022-9e69ac91" }}
      vc_image: {{ env "LODESTAR_IMAGE" | default "ghcr.io/yoshidan/lodestar:v1.49.0-pr10022-9e69ac91" }}
      supernode: true
  network_params:
    preset: minimal
    fulu_fork_epoch: 0
    # op-deployer needs ~29 transactions to stand the L2 up, which takes several
    # minutes. Any of them that lands in the first Amsterdam block reverts: the gas is
    # estimated under the pre-fork rules and the inner CREATE2 then runs out under the
    # post-fork ones. Keep the fork far enough out that deployment finishes first —
    # epoch 16 = 768s at 6s slots, against roughly 350s of deployment.
    # Must stay in step with AmsterdamTime in op-service/eth/config.go.
    gloas_fork_epoch: 16
    genesis_delay: 5
    bpo_1_epoch: 0
    bpo_1_max_blobs: 15
    bpo_1_target_blobs: 10
    bpo_2_epoch: 1 # required to be bigger than bpo_1_epoch
    bpo_2_max_blobs: 21
    bpo_2_target_blobs: 14
    # ethereum-genesis-generator 6.0.8 does not deploy the EIP-7732 builder system
    # contracts, and geth >= v1.17.6 rejects a system call into an address with no code
    # ("empty system contract"), so the chain halts at the first Amsterdam block. Older
    # builds silently treated the empty return as a no-op. The bytecode below is
    # params.BuilderDepositCode / params.BuilderExitCode from go-ethereum v1.17.6.
    # Drop these once the genesis generator deploys them itself.
    additional_preloaded_contracts: |
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        },
        "0x0000BFF46984E3725691FA540A8C7589300D8282": {
          "balance": "0ETH",
          "code": "",
          "storage": {},
          "nonce": "1"
        },
        "0x000064D678505AD48F8CCB093BC65613800E8282": {
          "balance": "0ETH",
          "code": "",
          "storage": {},
          "nonce": "1"
        }
      }
